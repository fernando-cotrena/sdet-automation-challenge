
name: Automated Tests Suite

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # schedule:
  #   - cron: '0 12 * * 1-5' # Lunes a viernes, 9 AM Argentina

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test-api:
    name: API Automation (Swagger Petstore)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:api

      - name: Upload API Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: reports/mocha/
          if-no-files-found: warn
          retention-days: 7

  test-ui:
    name: UI Automation (Buggy Cars Rating)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:ui

      - name: Upload Screenshots on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failure-screenshots
          path: cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload UI Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: reports/mocha/
          if-no-files-found: warn
          retention-days: 7

  generate-report:
    name: Merge & Publish Test Report
    runs-on: ubuntu-latest
    needs: [test-api, test-ui]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download API Test Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: api-test-results
          path: reports/mocha/api

      - name: Download UI Test Results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ui-test-results
          path: reports/mocha/ui

      - name: Generate Consolidated HTML Report
        run: npm run report

      - name: Publish Consolidated HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mochawesome-html-report
          path: reports/html/
          if-no-files-found: warn
          retention-days: 14
