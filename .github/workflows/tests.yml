name: Daily Automated Tests

on:
  schedule:
    - cron: '0 12 * * *' # Every day at 9:00 AM Argentina time (UTC-3)

  workflow_dispatch: # Allow manual execution

jobs:
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run API tests
        run: npm run test:api

      - name: Upload API results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: reports/mocha
          if-no-files-found: ignore
          retention-days: 14

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run UI tests
        run: npm run test:ui

      - name: Upload UI results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: reports/mocha
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failure-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 14

  generate-report:
    name: Generate HTML Report
    runs-on: ubuntu-latest
    needs: [api-tests, ui-tests]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download API results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: api-test-results
          path: reports/mocha/api

      - name: Download UI results
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ui-test-results
          path: reports/mocha/ui

      - name: Generate consolidated report
        run: npm run report

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-automated-test-report
          path: reports/html
          if-no-files-found: warn
          retention-days: 14
